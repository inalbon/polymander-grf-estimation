[project]
name = "polymander-grf-estimation"
version = "0.1.0"
description = "Estimate ground reaction forces from motor currents of the Polymander robot"
requires-python = ">=3.8"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["polymander"]